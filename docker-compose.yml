services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: podcasts
      POSTGRES_PASSWORD: podcasts
      POSTGRES_DB: podcasts
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podcasts -d podcasts"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://podcasts:podcasts@db:5432/podcasts
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
