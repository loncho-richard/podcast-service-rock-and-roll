services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: podcasts
      POSTGRES_PASSWORD: podcasts
      POSTGRES_DB: podcasts
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podcasts -d podcasts"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://podcasts:podcasts@db:5432/podcasts
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Local-only defaults so `docker compose up` works from a clean checkout.
      # Override them via the shell or a `.env` file; never reuse them in production.
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-reviewer}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:-local-dev-secret-change-me}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-0123456789}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      # Point this at an unreachable host to see the offline fallback in action.
      ITUNES_BASE_URL: ${ITUNES_BASE_URL:-https://itunes.apple.com}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
